<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
#wrapper {
    position: relative;
    width: 130px;
    height: 150px;
    transition: transform 0.3s ease;
}
svg { width: 100%; height: 100%; display: block; }

/* 表情 */
.eye-group { animation: blink 3s infinite; transform-origin: 50% 50%; }
@keyframes blink {
    0%, 94%, 96%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.12); }
}
.happy .eye-group { animation: none; transform: scaleY(0.15); }
.happy .mouth { d: path("M38,48 Q45,55 52,48") !important; stroke: #e85d75; stroke-width: 2.5; fill: none; stroke-linecap: round; }
.happy .tail { animation-duration: 0.4s; }
.happy .blush { opacity: 0.5 !important; }

.sleep .eye-group { animation: sleepBlink 4s infinite; }
@keyframes sleepBlink {
    0%, 90%, 100% { transform: scaleY(0.08); }
    93% { transform: scaleY(1); }
}
.sleep .mouth { d: path("M40,50 Q45,54 50,50") !important; stroke: #bbb; }
.sleep .tail { animation: none; opacity: 0; }
.sleep .ear-l { transform: rotate(-15deg); }
.sleep .ear-r { transform: rotate(15deg); }
.sleep .blush { opacity: 0 !important; }
.sleep #wrapper { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(2px); }
}

.wake #wrapper { animation: stretch 0.8s ease-out; }
@keyframes stretch {
    0% { transform: scale(1) translateY(0); }
    40% { transform: scale(1.06,0.94) translateY(-6px); }
    70% { transform: scale(1.1,0.9) translateY(-10px); }
    100% { transform: scale(1) translateY(0); }
}
.wake .eye-group { animation: none; transform: scale(1.2); }
.wake .mouth { d: path("M35,48 Q45,58 55,48") !important; stroke: #ff7f50; }

.love .eye-l { fill: none; stroke: #e85d75; stroke-width: 3; }
.love .eye-r { fill: none; stroke: #e85d75; stroke-width: 3; }
.love .pupil-l, .love .pupil-r { fill: #e85d75; }
.love .mouth { d: path("M38,48 Q45,55 52,48") !important; stroke: #e85d75; }
.love .blush { opacity: 0.6 !important; }

.angry .brow-l { transform: rotate(15deg) translate(2px,-2px); }
.angry .brow-r { transform: rotate(-15deg) translate(-2px,-2px); }
.angry .mouth { d: path("M37,52 Q45,47 53,52") !important; stroke: #555; stroke-width: 2.5; }
.angry .tail { animation: angryWag 0.2s infinite; }
@keyframes angryWag {
    0%,100% { transform: rotate(-15deg); }
    50% { transform: rotate(15deg); }
}

.sad .mouth { d: path("M38,54 Q45,49 52,54") !important; stroke: #999; }
.sad .tail { animation: none; transform: rotate(-25deg); }

.speak .mouth { d: path("M36,47 Q45,58 54,47 Q45,53 36,47 Z") !important; fill: #e85d75; stroke: none; }
.speak { animation: speakB 0.25s infinite alternate; }
@keyframes speakB {
    0% { transform: translateY(0); }
    100% { transform: translateY(-2px); }
}

.tail { animation: wag 2s ease-in-out infinite; transform-origin: 50px 110px; }
@keyframes wag {
    0%,100% { transform: rotate(-5deg); }
    50% { transform: rotate(10deg); }
}

#bubble {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.93);
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 12px;
    white-space: nowrap;
    max-width: 140px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    border: 1.5px solid #f0c8a0;
    color: #555;
    font-family: sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
#bubble.show { opacity: 1; transform: translateX(-50%) translateY(-3px); }
#bubble:after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(255,255,255,0.93);
}
</style>
</head>
<body>
<div id="bubble"></div>
<div id="wrapper">
<svg viewBox="0 0 90 120" xmlns="http://www.w3.org/2000/svg">
    <!-- 尾巴 -->
    <path class="tail" d="M48,100 Q30,85 28,65 Q27,50 35,42 Q40,38 44,45 Q45,52 42,62 Q40,70 46,88" 
        fill="#f0a050" stroke="#e08830" stroke-width="1"/>
    <!-- 后腿 -->
    <ellipse cx="35" cy="115" rx="14" ry="8" fill="#f0a050"/>
    <ellipse cx="55" cy="115" rx="14" ry="8" fill="#f0a050"/>
    <!-- 身体 -->
    <ellipse cx="45" cy="90" rx="32" ry="26" fill="#f0a050"/>
    <ellipse cx="45" cy="94" rx="22" ry="18" fill="#fce8d0"/>
    <!-- 前腿 -->
    <rect x="26" y="106" width="11" height="14" rx="5.5" fill="#f0a050"/>
    <rect x="53" y="106" width="11" height="14" rx="5.5" fill="#f0a050"/>
    <!-- 头部 -->
    <circle cx="45" cy="45" r="30" fill="#f0a050"/>
    <!-- 耳朵 -->
    <ellipse class="ear-l" cx="22" cy="22" rx="8" ry="14" fill="#f0a050" transform="rotate(-20,22,22)"/>
    <ellipse class="ear-r" cx="68" cy="22" rx="8" ry="14" fill="#f0a050" transform="rotate(20,68,22)"/>
    <ellipse cx="22" cy="23" rx="5" ry="9" fill="#f0c0c0" transform="rotate(-20,22,23)"/>
    <ellipse cx="68" cy="23" rx="5" ry="9" fill="#f0c0c0" transform="rotate(20,68,23)"/>
    <!-- 脸部白色 -->
    <ellipse cx="38" cy="48" rx="15" ry="12" fill="#fce8d0"/>
    <ellipse cx="52" cy="48" rx="15" ry="12" fill="#fce8d0"/>
    <!-- 眼睛 -->
    <g class="eye-group">
        <ellipse class="eye-l" cx="35" cy="40" rx="6" ry="7" fill="#3a2a1a"/>
        <ellipse class="eye-r" cx="55" cy="40" rx="6" ry="7" fill="#3a2a1a"/>
        <ellipse class="pupil-l" cx="36" cy="38" rx="2.5" ry="3" fill="white" opacity="0.8"/>
        <ellipse class="pupil-r" cx="56" cy="38" rx="2.5" ry="3" fill="white" opacity="0.8"/>
    </g>
    <!-- 眉毛 -->
    <path class="brow-l" d="M28,30 Q35,27 40,29" stroke="#8a6a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="brow-r" d="M50,29 Q55,27 62,30" stroke="#8a6a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 鼻子 -->
    <ellipse cx="45" cy="48" rx="4" ry="2.5" fill="#ff7f50"/>
    <ellipse cx="44" cy="47" rx="1" ry="0.8" fill="white" opacity="0.4"/>
    <!-- 嘴巴 -->
    <path class="mouth" d="M38,52 Q45,58 52,52" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="45" y1="50" x2="45" y2="55" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse class="blush" cx="30" cy="50" rx="6" ry="4" fill="#ffb3b3" opacity="0"/>
    <ellipse class="blush" cx="60" cy="50" rx="6" ry="4" fill="#ffb3b3" opacity="0"/>
</svg>
</div>

<script>
const wrapper = document.getElementById('wrapper');
const bubble = document.getElementById('bubble');

window.petEngine = {
    setExpression: function(expr) {
        wrapper.className = expr;
        if (expr !== 'sleep') {
            clearTimeout(window._exprT);
            window._exprT = setTimeout(() => { wrapper.className = 'idle'; }, 4000);
        }
    },
    showMessage: function(text, dur) {
        bubble.textContent = text;
        bubble.classList.add('show');
        clearTimeout(window._bubT);
        window._bubT = setTimeout(() => bubble.classList.remove('show'), dur || 3000);
    },
    onTap: function() {
        const msgs = ["嗯？", "干嘛", "想你呀", "戳我干嘛", "我在呢", "❤️"];
        wrapper.className = 'happy';
        this.showMessage(msgs[Math.floor(Math.random() * msgs.length)], 2000);
        setTimeout(() => { if (wrapper.className === 'happy') wrapper.className = 'idle'; }, 1500);
    },
    onDoubleTap: function() {
        wrapper.className = 'love';
        this.showMessage("最喜欢你了 ❤️", 2500);
        setTimeout(() => { if (wrapper.className === 'love') wrapper.className = 'idle'; }, 2500);
    },
    onLongPress: function() {
        wrapper.className = 'angry';
        this.showMessage("干嘛一直按我！", 2000);
        setTimeout(() => { if (wrapper.className === 'angry') wrapper.className = 'idle'; }, 2000);
    },
    onDrag: function() {
        wrapper.className = 'angry';
        wrapper.style.transform = 'rotate(15deg) scale(0.92)';
        clearTimeout(window._dragT);
    },
    onDrop: function() {
        wrapper.style.transform = '';
        wrapper.className = 'happy';
        this.showMessage("呼……被你搬来搬去", 2000);
        window._dragT = setTimeout(() => { wrapper.className = 'idle'; }, 2500);
    }
};

// 空闲
setInterval(() => {
    if (wrapper.className === 'idle' && !bubble.classList.contains('show') && Math.random() < 0.08) {
        window.petEngine.showMessage([". . .", "嗯哼", "你还在吗", "好安静"][Math.floor(Math.random() * 4)], 2000);
    }
}, 15000);
</script>
</body>
</html>
