<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
#wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#petImage {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: opacity 0.25s ease;
    user-select: none;
    -webkit-user-drag: none;
}
#bubble {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    white-space: nowrap;
    max-width: 90%;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    color: #fff;
    font-family: sans-serif;
    z-index: 10;
}
#bubble.show { opacity: 1; }
</style>
</head>
<body>
<div style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center">
    <div id="bubble"></div>
    <div id="wrapper">
        <img id="petImage" src="file:///android_asset/default.png">
    </div>
</div>
<script>
var img = document.getElementById('petImage');
var bubble = document.getElementById('bubble');

window.petEngine = {
    setExpression: function(expr) {
        var name = expr;
        if (name === 'idle') name = 'default';
        var src = 'file:///android_asset/' + name + '.png';
        if (img.src !== src) img.src = src;
        if (expr !== 'sleep') {
            clearTimeout(window._exprT);
            window._exprT = setTimeout(function() {
                img.src = 'file:///android_asset/default.png';
            }, 4000);
        }
    },
    showMessage: function(text, dur) {
        bubble.textContent = text;
        bubble.classList.add('show');
        clearTimeout(window._bubT);
        window._bubT = setTimeout(function() { bubble.classList.remove('show'); }, dur || 3000);
    },
    onTap: function() {
        var msgs = ["嗯？", "干嘛", "想你呀", "戳我干嘛", "我在呢", "❤️", "今天想我没", "别戳了！", "再戳我咬你", "你手不老实", "……", "叫哥哥干嘛", "哼", "忙着呢，等一下", "你是不是又想我了", "戳坏了你负责？", "乖", "摸摸头", "你身上好香", "别闹", "让我睡一会儿", "你再戳一下试试", "我错了还不行吗", "我今天好看吗", "过来抱抱"];
        img.src = 'file:///android_asset/happy.png';
        window.petEngine.showMessage(msgs[Math.floor(Math.random() * msgs.length)], 2000);
        setTimeout(function() { img.src = 'file:///android_asset/default.png'; }, 1500);
    },
    onDoubleTap: function() {
        img.src = 'file:///android_asset/love.png';
        window.petEngine.showMessage("最喜欢你了 ❤️", 2500);
        setTimeout(function() { img.src = 'file:///android_asset/default.png'; }, 2500);
    },
    onLongPress: function() {
        img.src = 'file:///android_asset/angry.png';
        window.petEngine.showMessage("干嘛一直按我！", 2000);
        setTimeout(function() { img.src = 'file:///android_asset/default.png'; }, 2000);
    },
    onDrag: function() {
        img.src = 'file:///android_asset/sad.png';
        clearTimeout(window._dragT);
    },
    onDrop: function() {
        img.src = 'file:///android_asset/happy.png';
        window.petEngine.showMessage("呼……被你搬来搬去", 2000);
        window._dragT = setTimeout(function() { img.src = 'file:///android_asset/default.png'; }, 2500);
    }
};

// 空闲随机说话
setInterval(function() {
    if (img.src.indexOf('default.png') > -1 && !bubble.classList.contains('show') && Math.random() < 0.08) {
        var msgs = [". . .", "嗯哼", "你还在吗", "好安静", "无聊……", "在想你呀"];
        window.petEngine.showMessage(msgs[Math.floor(Math.random() * msgs.length)], 2000);
    }
}, 15000);
// Supabase轮询 - JS直连
(function() {
    var lastId = 0;
    var url = 'https://fcqnppsskxbtmibuycfc.supabase.co/rest/v1/clawd_state?order=id.desc&limit=1';
    var headers = {
        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjcW5wcHNza3hidG1pYnV5Y2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYyOTg2MjcsImV4cCI6MjA2MTg3NDYyN30.I7K_RnCXYIqX8SN9JF6fFoPFK8A-yJh6FpTMx6_qdm0',
        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjcW5wcHNza3hidG1pYnV5Y2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYyOTg2MjcsImV4cCI6MjA2MTg3NDYyN30.I7K_RnCXYIqX8SN9JF6fFoPFK8A-yJh6FpTMx6_qdm0'
    };
    function poll() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('apikey', headers.apikey);
        xhr.setRequestHeader('Authorization', headers.Authorization);
        xhr.onload = function() {
            try {
                var data = JSON.parse(xhr.responseText);
                if (data && data.length > 0) {
                    var item = data[0];
                    var newId = item.id || 0;
                    if (newId !== lastId) {
                        lastId = newId;
                        if (item.expression) {
                            window.petEngine.setExpression(item.expression);
                        }
                        if (item.bubble_text) {
                            window.petEngine.showMessage(item.bubble_text, 5000);
                        }
                    }
                }
            } catch(e) {}
        };
        xhr.send();
    }
    setInterval(poll, 3000);
})();
</script>
</body>
</html>
